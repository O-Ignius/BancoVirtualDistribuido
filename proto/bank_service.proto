syntax = "proto3";

package bank.service;

option java_package = "br.com.bancoVirtualDistribuido.grpc.service";
option java_multiple_files = true;
option java_outer_classname = "BankServiceProto";

// import de tipo
import "google/protobuf/timestamp.proto";

service BankService {

  // -------Contas

    rpc LoginService(LoginServiceRequest)
        returns (LoginServiceResponse);
    // Consulta uma conta bancária.
    rpc GetAccountService(GetAccountServiceRequest)
        returns (GetAccountServiceResponse);

    rpc createAccountService(CreateAccountServiceRequest)
        returns (CreateAccountServiceResponse);

    rpc EditAccountService(EditAccountServiceRequest)
        returns (EditAccountServiceResponse);

    rpc DeleteAccountService(DeleteAccountServiceRequest)
        returns (DeleteAccountServiceResponse);
  // -------Contas

  // -------Transferencias
    //recupera transferencias de um dado cpf
    rpc GetTransferService(GetTransferServiceRequest)
        returns (GetTransferServiceResponse);

    //lê todas as transferencias entre 2 cpfs
    rpc GetAllTransfersBetweenCPFsService(GetAllTransfersBetweenCPFsServiceRequest)
        returns (GetAllTransfersBetweenCPFsServiceResponse);

    //lê todas entre 2 datas 
    rpc GetAllTransfersBetweenDateService(GetAllTransfersBetweenDateServiceRequest)
        returns (GetAllTransfersBetweenDateServiceResponse);

    // persiste uma transferência.
    rpc SaveTransferService(SaveTransferServiceRequest)
        returns (SaveTransferServiceResponse);

  // -------Transferencias
}

// ==============================
// ==============================
// Contas
// ==============================
// ==============================

// ==============================
// tenta logar
// ==============================
message LoginServiceRequest {
    string id = 1;
    string password = 2;
}

message LoginServiceResponse {
    bool success = 1;
}

// ==============================
// Consulta de conta
// ==============================

message GetAccountServiceRequest {
    int64 cpf = 1;
}

message GetAccountServiceResponse {
    int64 cpf = 1;
    string owner = 2;
    int64 balance_cents = 3;
}

// ==============================
// cria conta
// ==============================

message CreateAccountServiceRequest {
    string user = 1;
    string password = 2;
    int64 cpf = 3;
}
message CreateAccountServiceResponse {
    bool success = 1;
}

// ==============================
// edita conta
// ==============================

message EditAccountServiceRequest {
    string user = 1;
    string password = 2;
    int64 cpf = 3;
}
message EditAccountServiceResponse {
    bool success = 1;
}

// ==============================
// deleta conta
// ==============================

message DeleteAccountServiceRequest {
    string id = 1;
}
message DeleteAccountServiceResponse {
    bool success = 1;
}

// ==============================
// ==============================
// Transferencias
// ==============================
// ==============================
// tipo
message Transfer {
    string transfer_id = 1;
    int64 source = 2;
    int64 destiny= 3;
    int64 amount_cents = 4;
    google.protobuf.Timestamp created_at = 5;
}

// ==============================
// Consulta de transferências de um cps
// ==============================

message GetTransferServiceRequest {
    int64 source = 1;
}

message GetTransferServiceResponse {
    bool found = 1;
    repeated Transfer transfer = 2;
}

// ==============================
// Consulta de transferência entre 2 cpfs
// ==============================

message GetAllTransfersBetweenCPFsServiceRequest {
    int64 source = 1;
    int64 destiny = 2;
}

message GetAllTransfersBetweenCPFsServiceResponse {
    bool found = 1;
    repeated Transfer transfer = 2;
}


// ==============================
// consulta de transferencias entre 2 datas
// ==============================

message GetAllTransfersBetweenDateServiceRequest {
    google.protobuf.Timestamp start = 1;
    google.protobuf.Timestamp end = 2;
}

message GetAllTransfersBetweenDateServiceResponse {
    bool found = 1;
    repeated Transfer transfer = 2;
}

// ==============================
// Persistência de transferência
// ==============================

message SaveTransferServiceRequest {
    string transfer_id = 1;
    int64 source_cpf = 2;
    int64 destination_cpf = 3;
    int64 amount_cents = 4;
}

message SaveTransferServiceResponse {
    bool success = 1;
}
