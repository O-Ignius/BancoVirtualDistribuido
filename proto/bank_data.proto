syntax = "proto3";

package bank.data;

option java_package = "br.com.bancoVirtualDistribuido.grpc.data";
option java_multiple_files = true;
option java_outer_classname = "BankDataProto";

// import de tipo
import "google/protobuf/timestamp.proto";

service BankDataService {
//----------Conta
  //tenta login
    rpc VerifyCredentialsData(VerifyCredentialsDataRequest)
        returns (VerifyCredentialsDataResponse);

  //le uma conta
    rpc ReadAccountData(ReadAccountDataRequest)
        returns (ReadAccountDataResponse);

    //edita conta já existente
    rpc EditAccountData(EditAccountDataRequest)
        returns (EditAccountDataResponse);


    //exclui conta já existente
    rpc DeleteAccountData(DeleteAccountDataRequest)
        returns (DeleteAccountDataResponse);

    // persiste uma conta
    rpc SaveAccountData(SaveAccountDataRequest)
        returns (SaveAccountDataResponse);

//----------Conta
//
//----------transferência
    //recupera transferencias de um dado cpf
    rpc GetTransferData(GetTransferDataRequest)
        returns (GetTransferDataResponse);

    //lê todas as transferencias entre 2 cpfs
    rpc ReadAllTransferBetweenCPFsData(ReadAllTransferBetweenCPFsDataRequest)
        returns (ReadAllTransferBetweenCPFsDataResponse);

    //lê todas entre 2 datas 
    rpc ReadAllTransferBetweenDateData(ReadAllTransferBetweenDateDataRequest)
        returns (ReadAllTransferBetweenDateDataResponse);

    // persiste uma transferência.
    rpc SaveTransferData(SaveTransferDataRequest)
        returns (SaveTransferDataResponse);
//----------transferência
}

// ==============================
// verifica credencias
// ==============================

message VerifyCredentialsDataRequest {
    string id = 1;
    string password = 2;
}

message VerifyCredentialsDataResponse {
    bool success = 1;
}


// ==============================
// Consulta de conta
// ==============================

message ReadAccountDataRequest {
    string cpf = 1;
}

message ReadAccountDataResponse {
    bool found = 1;
    string cpf = 2;
    string owner = 3;
    int64 balance_cents = 4;
}

// ==============================
// Edição de conta
// ==============================
message EditAccountDataRequest {
    string cpf = 1;
    string owner = 2;
    string password = 3;
}

message EditAccountDataResponse {
    bool success = 1;
}

// ==============================
// Exclusão de conta
// ==============================
message DeleteAccountDataRequest {
    string cpf = 1;
}

message DeleteAccountDataResponse {
    bool success = 1;
}

// ==============================
// Persistência de conta
// ==============================

message SaveAccountDataRequest {
    string cpf = 1;
    string owner = 2;
    string password = 3;
    int64 balance_cents = 4;
}

message SaveAccountDataResponse {
    bool success = 1;
}

// ------------------------------------------------------
// TRANSFERENCIA 
// ------------------------------------------------------
message Transfer {
    string transfer_id = 1;
    string source = 2;
    string destiny= 3;
    int64 amount_cents = 4;
    google.protobuf.Timestamp created_at = 5;
}

// ==============================
// consulta todas transferencias de um cpf
// ==============================

message GetTransferDataRequest {
    string cpf = 1;
}

message GetTransferDataResponse {
    bool found = 1;
    repeated Transfer transfer = 2;
}

// ==============================
// Consulta de transferência entre 2 cpfs
// ==============================

message ReadAllTransferBetweenCPFsDataRequest {
    string source = 1;
    string destiny = 2;
}

message ReadAllTransferBetweenCPFsDataResponse {
    bool found = 1;
    repeated Transfer transfer = 2;
}


// ==============================
// consulta de transferencias entre 2 datas
// ==============================

message ReadAllTransferBetweenDateDataRequest {
    google.protobuf.Timestamp start = 1;
    google.protobuf.Timestamp end = 2;
}

message ReadAllTransferBetweenDateDataResponse {
    bool found = 1;
    repeated Transfer transfer = 2;
}

// ==============================
// Persistência de transferência
// ==============================

message SaveTransferDataRequest {
    string transfer_id = 1;
    string source_cpf = 2;
    string destination_cpf = 3;
    int64 amount_cents = 4;
}

message SaveTransferDataResponse {
    bool success = 1;
}
